<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Store - Free Fire Pro</title>

<!-- Fuentes y Banderas -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.2/css/flag-icons.min.css"/>

<style>
:root {
  --ff-cyan: #00acc1;
  --ff-cyan-glow: rgba(0, 172, 193, 0.4);
  --dark-bg: #0d1117;
  --card-bg: #161b22;
  --border-color: #30363d;
  --accent-gradient: linear-gradient(45deg, #ff3b3b, #ff7b00);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background-color: var(--dark-bg);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #111e2d 0%, #0d1117 100%);
  z-index: -1;
}

.container {
  padding: 40px 15px;
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  letter-spacing: 2px;
  margin-bottom: 30px;
  text-transform: uppercase;
  background: linear-gradient(to bottom, #ffffff, #888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-align: center;
}

/* Selector de País */
.country-selector {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
}

.country-btn {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  padding: 10px 20px;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.8rem;
  transition: 0.3s;
}

.country-btn.active {
  border-color: var(--ff-cyan);
  box-shadow: 0 0 10px var(--ff-cyan-glow);
  background: rgba(0, 172, 193, 0.1);
}

/* Sección de Búsqueda */
.search-section {
  background: rgba(255, 255, 255, 0.03);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  backdrop-filter: blur(12px);
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 500px;
  margin-bottom: 20px;
}

@media (max-width: 480px) {
  .search-section { flex-direction: column; }
}

.search-section input {
  flex: 1;
  padding: 15px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: #0d1117;
  color: white;
  outline: none;
}

.btn-verify {
  padding: 15px 25px;
  border: none;
  border-radius: 12px;
  background: var(--accent-gradient);
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-weight: bold;
  cursor: pointer;
}

#status-msg {
  margin-bottom: 20px;
  font-weight: bold;
  color: var(--ff-cyan);
  text-align: center;
}

#payment-area {
  display: none;
  margin-bottom: 30px;
  width: 100%;
  max-width: 400px;
}

.payment-select {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #161b22;
  color: white;
  border: 1px solid var(--border-color);
}

/* Grilla centrada */
.diamond-grid {
  display: none; 
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 1000px;
  justify-items: center; /* Centra las tarjetas en el grid */
}

.diamond-card {
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid var(--border-color);
  padding: 25px;
  transition: 0.3s;
  display: flex;
  flex-direction: column;
  align-items: center; /* Centra el contenido interno */
  width: 100%;
}

.diamond-card:hover {
  transform: translateY(-5px);
  border-color: var(--ff-cyan);
}

.amount-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  margin-bottom: 10px;
}

.price-text {
  font-size: 1.6rem;
  color: #4caf50;
  font-weight: bold;
  margin-bottom: 20px;
  font-family: 'Roboto', sans-serif;
}

.btn-buy {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--ff-cyan);
  color: white;
  font-family: 'Orbitron';
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <h1 class="title">RECARGA DIAMANTES</h1>

  <!-- Selector de País -->
  <div class="country-selector">
    <button class="country-btn active" id="btn-arg" onclick="setCountry('arg')">
      <span class="fi fi-ar"></span> ARGENTINA
    </button>
    <button class="country-btn" id="btn-per" onclick="setCountry('per')">
      <span class="fi fi-pe"></span> PERÚ
    </button>
  </div>

  <!-- BUSCADOR -->
  <div class="search-section">
    <input type="text" id="uid" placeholder="ID de Jugador">
    <button class="btn-verify" onclick="buscarPlayer()">VERIFICAR</button>
  </div>

  <div id="status-msg"></div>

  <!-- PAGO -->
  <div id="payment-area">
    <select id="metodo_pago" class="payment-select">
      <option value="" disabled selected>Selecciona tu forma de pago...</option>
      <option value="Transferencia / Mercado Pago">Transferencia / Mercado Pago / Alias o Cvu</option>
      <option value="Yape / Plin">Yape / Plin</option>
      <option value="Efectivo">Efectivo</option>
      <option value="Cripto / USDT">Cripto - USDT</option>
    </select>
  </div>

  <!-- PRODUCTOS -->
  <div id="diamond-grid" class="diamond-grid">
    <!-- Se genera con JavaScript -->
  </div>
</div>
<script>
let currentCountry = 'arg';

const packages = [
  { qty: 110, arg: 1200, per: 3 },
  { qty: 341, arg: 3600, per: 8.6 },
  { qty: 572, arg: 5800, per: 13.6 },
  { qty: 1166, arg: 11500, per: 27 },
  { qty: 2398, arg: 19800, per: 49 },
  { qty: 6160, arg: 47000, per: 117 }
];

// ESTA ES LA FUNCIÓN QUE DEBES PEGAR
function formatNumber(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function renderPackages() {
  const grid = document.getElementById('diamond-grid');
  grid.innerHTML = '';
  
  packages.forEach(pkg => {
    let priceLabel;
    if (currentCountry === 'arg') {
      // Ahora usará el punto forzado
      priceLabel = `$${formatNumber(pkg.arg)}`;
    } else {
      // Para Perú mantenemos el punto en los decimales
      priceLabel = `S/ ${pkg.per.toString().replace(',', '.')}`;
    }
    
    grid.innerHTML += `
      <div class="diamond-card">
        <div class="amount-text">${pkg.qty} 💎</div>
        <div class="price-text">${priceLabel}</div>
        <button class="btn-buy" onclick="comprar(${pkg.qty}, '${priceLabel}')">COMPRAR</button>
      </div>
    `;
  });
}

// ... resto del código igua
function setCountry(country) {
  currentCountry = country;
  document.getElementById('btn-arg').classList.toggle('active', country === 'arg');
  document.getElementById('btn-per').classList.toggle('active', country === 'per');
  renderPackages();
}

async function buscarPlayer() {
  const uid = document.getElementById("uid").value.trim();
  const status = document.getElementById("status-msg");
  const grid = document.getElementById("diamond-grid");
  const paymentArea = document.getElementById("payment-area");

  if (!uid) { status.innerHTML = "❌ Escribe tu ID"; return; }
  status.innerHTML = "🔎 Verificando...";

  try {
    const res = await fetch(`https://upon-frequency-ict-mitchell.trycloudflare.com/api/player?uid=${uid}`);
    const data = await res.json();

    if (data.status === "ok") {
      status.setAttribute("data-nickname", data.nickname);
      status.innerHTML = `✅ Bienvenido: <span style="color:#fff">${data.nickname}</span>`;
      grid.style.display = "grid";
      paymentArea.style.display = "block";
      renderPackages();
    } else {
      status.innerHTML = "❌ ID no válido";
    }
  } catch {
    status.innerHTML = "⚠️ Error de conexión";
  }
}

function comprar(cantidad, precioLabel) {
  const uid = document.getElementById("uid").value;
  const nickname = document.getElementById("status-msg").getAttribute("data-nickname") || "Jugador";
  const metodo = document.getElementById("metodo_pago").value;
  const pais = currentCountry === 'arg' ? "🇦🇷 Argentina" : "🇵🇪 Perú";

  if (!metodo) {
    alert("⚠️ Selecciona un método de pago.");
    return;
  }

  const mensaje = `💎 *NUEVO PEDIDO FF*
🌍 *País:* ${pais}
👤 *Jugador:* ${nickname}
🆔 *ID:* ${uid}
📦 *Paquete:* ${cantidad} Diamantes
💰 *Total:* ${precioLabel}
💳 *Pago:* ${metodo}`;

  window.open(`https://wa.me/5493517016162?text=${encodeURIComponent(mensaje)}`, '_blank');
}

// Inicializar
renderPackages();
</script>

</body>
</html>
