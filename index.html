<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Store - Free Fire Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root {
  --ff-cyan: #00acc1;
  --ff-cyan-glow: rgba(0, 172, 193, 0.4);
  --dark-bg: #0d1117;
  --card-bg: #161b22;
  --border-color: #30363d;
  --accent-gradient: linear-gradient(45deg, #ff3b3b, #ff7b00);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background-color: var(--dark-bg);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

/* Fondo animado simple */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at center, #111e2d 0%, #0d1117 100%);
  z-index: -1;
}

.container {
  padding: 40px 15px;
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  letter-spacing: 2px;
  margin-bottom: 30px;
  text-transform: uppercase;
  background: linear-gradient(to bottom, #ffffff, #888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Sección de Búsqueda */
.search-section {
  background: rgba(255, 255, 255, 0.03);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: row;
  gap: 10px;
  width: 100%;
  max-width: 500px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

@media (max-width: 480px) {
  .search-section { flex-direction: column; }
}

.search-section input {
  flex: 1;
  padding: 15px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  background: #0d1117;
  color: white;
  outline: none;
  font-size: 1rem;
}

.search-section input:focus {
  border-color: var(--ff-cyan);
  box-shadow: 0 0 15px var(--ff-cyan-glow);
}

.btn-verify {
  padding: 15px 25px;
  border: none;
  border-radius: 12px;
  background: var(--accent-gradient);
  color: white;
  font-family: 'Orbitron', sans-serif;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn-verify:hover {
  filter: brightness(1.2);
  transform: scale(1.05);
}

#status-msg {
  margin-bottom: 20px;
  font-size: 1.1rem;
  font-weight: bold;
  color: var(--ff-cyan);
  min-height: 1.5em;
}

/* Selector de Pago */
#payment-area {
  display: none;
  margin-bottom: 30px;
  width: 100%;
  max-width: 400px;
}

.payment-select {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #161b22;
  color: white;
  border: 1px solid var(--border-color);
  font-family: 'Roboto', sans-serif;
  font-size: 1rem;
  outline: none;
}

/* Grid de Diamantes */
.diamond-grid {
  display: none; 
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  width: 100%;
  max-width: 1000px;
}

.diamond-card {
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid var(--border-color);
  overflow: hidden;
  transition: 0.3s;
  padding: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.diamond-card:hover {
  transform: translateY(-8px);
  border-color: var(--ff-cyan);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.amount-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8rem;
  margin: 10px 0;
}

.price-text {
  font-size: 1.5rem;
  color: #4caf50;
  font-weight: bold;
  margin-bottom: 20px;
}

.btn-buy {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--ff-cyan);
  color: white;
  font-family: 'Orbitron';
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

.btn-buy:hover {
  background: #008b9c;
  box-shadow: 0 0 15px var(--ff-cyan-glow);
}
</style>
</head>
<body>

<div class="container">
  <h1 class="title">RECARGA DIAMANTES</h1>

  <!-- BUSCADOR -->
  <div class="search-section">
    <input type="text" id="uid" placeholder="Ingresa tu ID de Jugador">
    <button class="btn-verify" onclick="buscarPlayer()">VERIFICAR</button>
  </div>

  <div id="status-msg"></div>

  <!-- MÉTODO DE PAGO -->
  <div id="payment-area">
    <label style="display:block; margin-bottom:10px; font-family:'Orbitron'; font-size:0.7rem; color:var(--ff-cyan); letter-spacing:2px;">SELECCIONA TU PAGO</label>
    <select id="metodo_pago" class="payment-select">
      <option value="" disabled selected>Elegir método de pago...</option>
      <option value="Transferencia / Mercado Pago">Transferencia / Mercado Pago</option>
      <option value="Efectivo (Pagofacil/Rapipago)">Efectivo (Rapipago / Pagofacil)</option>
      <option value="Ualá / Otros">Ualá / Otros</option>
    </select>
  </div>

  <!-- GRILLA DE PRODUCTOS -->
  <div id="diamond-grid" class="diamond-grid">

    <div class="diamond-card">
      <div class="amount-text">110 💎</div>
      <div class="price-text">$1.500</div>
      <button class="btn-buy" onclick="comprar(110, 1500)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <div class="amount-text">341 💎</div>
      <div class="price-text">$3.600</div>
      <button class="btn-buy" onclick="comprar(341, 3600)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <div class="amount-text">572 💎</div>
      <div class="price-text">$5.800</div>
      <button class="btn-buy" onclick="comprar(572, 5800)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <div class="amount-text">1166 💎</div>
      <div class="price-text">$11.500</div>
      <button class="btn-buy" onclick="comprar(1166, 11500)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <div class="amount-text">2398 💎</div>
      <div class="price-text">$19.800</div>
      <button class="btn-buy" onclick="comprar(2398, 19800)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <div class="amount-text">6160 💎</div>
      <div class="price-text">$47.000</div>
      <button class="btn-buy" onclick="comprar(6160, 47000)">COMPRAR</button>
    </div>

  </div>
</div>

<script>
async function buscarPlayer() {
  const uid = document.getElementById("uid").value.trim();
  const status = document.getElementById("status-msg");
  const grid = document.getElementById("diamond-grid");
  const paymentArea = document.getElementById("payment-area");

  if (!uid) {
    status.innerHTML = "❌ Escribe tu ID primero";
    return;
  }

  status.innerHTML = "🔎 Buscando jugador...";

  try {
    const res = await fetch(`https://suburban-salvador-incl-bunny.trycloudflare.com/api/player?uid=${uid}`);
    const data = await res.json();

    if (data.status === "ok") {
      status.setAttribute("data-nickname", data.nickname);
      status.innerHTML = `✅ Bienvenido: <span style="color:#fff">${data.nickname}</span>`;
      grid.style.display = "grid";
      paymentArea.style.display = "block";
    } else {
      status.innerHTML = "❌ ID no válido";
      grid.style.display = "none";
      paymentArea.style.display = "none";
    }
  } catch {
    status.innerHTML = "⚠️ Error de conexión";
  }
}

function comprar(cantidad, precio) {
  const uid = document.getElementById("uid").value;
  const nickname = document.getElementById("status-msg").getAttribute("data-nickname") || "Jugador";
  const metodo = document.getElementById("metodo_pago").value;

  if (!metodo) {
    alert("⚠️ Por favor selecciona un método de pago.");
    document.getElementById("metodo_pago").focus();
    return;
  }

  const mensaje = `💎 *NUEVO PEDIDO*
👤 *Jugador:* ${nickname}
🆔 *ID:* ${uid}
📦 *Paquete:* ${cantidad} Diamantes
💰 *Total:* $${precio}
💳 *Pago:* ${metodo}`;

  const url = `https://wa.me/5493517016162?text=${encodeURIComponent(mensaje)}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
